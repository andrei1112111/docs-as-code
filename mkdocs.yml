site_name: Docs as Code

theme:
  name: readthedocs

plugins:
  - search
  - mermaid2:
      javascript: https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid

nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md
  - API:
      - Описание: api/index.md
  - ML:
      - Model Card: ml/model-card.md
      - Data Sheet: ml/dataset.md
      - Риски: ml/risks.md
